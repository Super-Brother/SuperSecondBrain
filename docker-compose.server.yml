# 服务器部署配置（FAISS 版本 - 轻量级）
# 用法: docker compose -f docker-compose.server.yml up -d

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.server
    environment:
      - VECTOR_STORE_BACKEND=faiss
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
